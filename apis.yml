name: Junk King
description: 'Junk King is a professional junk removal and hauling franchise operating
  across the United States and Canada as part of the Neighborly family of home service
  brands. Through locally owned and operated locations, Junk King provides full-service
  junk removal, self-service dumpster rental, and dumpster bag pickup for residential
  and commercial customers, handling appliance and furniture removal, estate and property
  cleanouts, construction debris, yard waste, and e-waste. The company emphasizes eco-friendly
  disposal, recycling, donating, and reusing as much collected material as possible.
  Junk King offers free estimates, same-day service in many markets, and online, phone,
  and text-based booking. It is a portfolio company associated with Norwest Venture
  Partners and is tracked in the API Evangelist network as a company profile; Junk King
  publishes no public API or developer platform.'
